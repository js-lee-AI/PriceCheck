[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pricecheck"
dynamic = ["version"]
description = "Risk-controlled selective LLM answering by pricing label-free checks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jungseob Lee" }]
keywords = ["selective-prediction", "risk-control", "llm-verification", "learn-then-test"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Pricing, the schedules and the calibration test need numpy and scipy only.
dependencies = ["numpy>=1.23", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pricecheck = "pricecheck.cli:main"

[project.urls]
Homepage = "https://github.com/js-lee-AI/PriceCheck"
Issues = "https://github.com/js-lee-AI/PriceCheck/issues"

[tool.setuptools.dynamic]
version = { attr = "pricecheck.__version__" }

[tool.setuptools.packages.find]
include = ["pricecheck*"]

[tool.setuptools.package-data]
pricecheck = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
